# =================================================================
# General Configuration
# =================================================================

# Log to a file
log_type error
# Connections and disconnections, with the client and the port (mosquitto/README.md)
log_type notice
log_dest file /var/log/mosquitto/mosquitto.log
#
# Enable password file for authentication
password_file /etc/mosquitto/passwords

# =================================================================
# MQTT Listener Configuration
# =================================================================

# Default listener for non-TLS connections on port 1883
listener 1883
allow_anonymous false

# =================================================================
# MQTTS Listener Configuration
# =================================================================

# Listener for TLS/SSL connections on port 8883
listener 8883
allow_anonymous false

# Path to the self-signed certificate
certfile /etc/mosquitto/certs/cert.pem
keyfile /etc/mosquitto/certs/key.pem
