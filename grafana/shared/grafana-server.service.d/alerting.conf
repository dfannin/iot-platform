# Drop-in for grafana-server: the Slack webhook for Grafana alerting (design §5.6).
# Host-wide: every project's alerts go through the shared "slack-alerts" contact point.
# Install as /etc/systemd/system/grafana-server.service.d/alerting.conf.
#
# The secrets file holds one line, KEY=value:
#   SLACK_ALERTS_WEBHOOK_URL=<the webhook URL from the Slack app>
# systemd reads it as root before starting Grafana, so it can be mode 600, owner root.
# The provisioned contact point uses $SLACK_ALERTS_WEBHOOK_URL.
[Service]
EnvironmentFile=/etc/grafana/secrets/slack-webhook-router-monitor
